name: Integration tests

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2024.1.6"
            python: "3.11"
          - homeassistant: "2024.6.4"
            python: "3.12"
          - homeassistant: "2026.10.0"
            python: "3.14"
    name: Home Assistant ${{ matrix.homeassistant }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: >-
          python -m pip install
          "homeassistant==${{ matrix.homeassistant }}"
          beautifulsoup4==4.15.0
          ruff==0.17.0
      - name: Constrain the older HA ACME dependency
        if: matrix.homeassistant == '2024.6.4'
        run: python -m pip install "josepy<2"
      - name: Check code
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
